      - ≤3B Q4_K_M (~2GB): 99 layers = full GPU. Max parallel 4.
      - 7-8B Q4_K_M (~4.9GB): 99 layers = full GPU (~5.0GB). Max parallel 3.
      - 14B Q4_K_M (~8GB): ~20-24 GPU layers. Partial offload, CPU handles rest.
      - 33B Q4_K_M (~20GB): ~8-12 GPU layers. Mostly CPU, expect 3-5 tok/s.
      Ollama auto-partitions when VRAM tight. No manual tuning needed for ≤8B models.
