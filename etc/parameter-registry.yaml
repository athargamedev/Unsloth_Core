# ═══════════════════════════════════════════════════════════════════════════
# Environment Variables
# ───────────────────────────────────────────────────────────────────────────
# Env vars that affect pipeline behavior. Tracked here for the resource
# calculator and frontend editor visibility.
# ═══════════════════════════════════════════════════════════════════════════

env_vars:
  OLLAMA_NUM_PARALLEL:
    type: int
    default: 4
    min: 1
    max: 8
    description: "Concurrent Ollama request slots"
    tooltip: "Higher = faster parallel eval. Set via systemd. 4 for 6GB VRAM, 8 for 12GB+."
    resource_impact: vram_linear
    resource_notes: |
      Each slot = ~200MB KV cache (Q8_0, 4096 ctx).
      Model VRAM + slots*200MB must fit in 5.0-5.3GB available (after OS overhead).
      Practical limits on 6GB:
      - ≤3B model: 4-6 slots
      - 7-8B model: 3-4 slots
      - 14B+ model: 1-2 slots (mostly CPU anyway)

  OLLAMA_FLASH_ATTENTION:
    type: bool
    default: true
    description: "Flash attention for Ollama"
    tooltip: "Free speed boost. Always enable."
    resource_impact: none

  OLLAMA_KV_CACHE_TYPE:
    type: choice
    default: "q8_0"
    choices: [f16, q8_0, q4_0]
    description: "KV cache quantization"
    tooltip: "q8_0 halves cache memory with near-zero quality loss."
    resource_impact: vram_linear

  CUDA_VISIBLE_DEVICES:
    type: str
    default: ""
    description: "GPU device selection"
    tooltip: "Select which GPU to use. Empty = all. Set to '0' for single GPU."
    resource_impact: vram_linear

  OLLAMA_MAX_LOADED_MODELS:
    type: int
    default: 1
    min: 1
    max: 10
    description: "Max models kept in GPU memory"
    tooltip: "Keep at 1 for 6GB VRAM. Only load one model at a time."
    resource_impact: vram_linear
